services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: habitthread
            POSTGRES_PASSWORD: habitthread
            POSTGRES_USER: habitthread
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U habitthread -d habitthread']
            interval: 5s
            timeout: 5s
            retries: 10
        ports:
            - '5433:5432'
        volumes:
            - habitthread-postgres:/var/lib/postgresql/data

    postgres-e2e:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: habitthread_e2e
            POSTGRES_PASSWORD: habitthread
            POSTGRES_USER: habitthread
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U habitthread -d habitthread_e2e']
            interval: 1s
            timeout: 5s
            retries: 20
        ports:
            - '${E2E_DB_PORT:-5434}:5432'
        tmpfs:
            - /var/lib/postgresql/data

volumes:
    habitthread-postgres:
